<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1D9E75" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <title>DOMIA</title>
  </head>
  <body>
    <div id="initial-loader" style="display:flex;align-items:center;justify-content:center;height:100vh;background:#F4F7F5;font-family:'Nunito',sans-serif;">
      <div style="text-align:center;">
        <div style="font-size:28px;font-weight:800;letter-spacing:1px;">
          <span style="color:#0D1117;">DOM</span><span style="color:#1A7A4A;">IA</span>
        </div>
        <div style="margin-top:16px;display:flex;justify-content:center;">
          <div style="width:32px;height:32px;border:3px solid #1A7A4A;border-top-color:transparent;border-radius:50%;animation:domia-spin 0.8s linear infinite;"></div>
        </div>
      </div>
    </div>
    <style>@keyframes domia-spin{to{transform:rotate(360deg)}}</style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(() => {})
      }
    </script>
  </body>
</html>
